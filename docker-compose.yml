# Local or single-server deployment: Postgres, a one-off migration, the web app
# and one test worker. Copy .env.example to .env and fill it in first.
#
#   docker compose up -d --build
#   docker compose run --rm web node dist/scripts/admin.js create-owner --email you@example.com --workspace "QA"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: testharvest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: testharvest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testharvest -d testharvest"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    image: testharvest:latest
    command: ["node", "dist/scripts/migrate.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://testharvest:${POSTGRES_PASSWORD}@db:5432/testharvest
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: testharvest:latest
    env_file: .env
    environment:
      DATABASE_URL: postgres://testharvest:${POSTGRES_PASSWORD}@db:5432/testharvest
      RUN_WORKER: "false"
      ARTIFACT_DIR: /data/artifacts
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - artifacts:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    image: testharvest:latest
    command: ["node", "dist/worker-main.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://testharvest:${POSTGRES_PASSWORD}@db:5432/testharvest
      # The scheduler runs in the worker; with several workers one leads (advisory lock).
      RUN_SCHEDULER: "true"
      ARTIFACT_DIR: /data/artifacts
    volumes:
      - artifacts:/data
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: "1gb"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  artifacts:
